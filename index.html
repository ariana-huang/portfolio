<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ari Huang: marketer, ex-AWS, Tech MBA at Cornell. Product marketing, growth and partnerships in ad-tech, media, streaming and sports tech.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ari Huang Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: light, multi-page (hash views). Work gallery first, case studies open from cards, About second. Motion only on hover. */
:root{
  --bg:#FFFFFF; --ink:#1B1B1F; --muted:#5F6068; --line:#E7E7EC; --accent:#3A5BFF;
  --sky:#DCE6FF; --pink:#FFE1EC; --sun:#FFF0BF; --mint:#D6F4E4; --lilac:#ECE3FF; --peach:#FFE5D3;
  --f-display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-accent:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hi{font-family:var(--f-accent);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}

/* Nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.logo{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-size:20px;text-decoration:none}
.logo span{color:var(--accent)}
.links{display:flex;align-items:center;gap:6px}
.navlink{text-decoration:none;font-weight:500;font-size:15px;padding:7px 12px;border-radius:999px}
.navlink:hover{background:var(--sky)}
.navlink[aria-current="page"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;font:500 15px var(--f-body);text-decoration:none;background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn:hover{transform:translateY(-2px);background:var(--sun)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.links{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.links .btn{display:none}.navlink{padding:6px 9px;font-size:14px}}
@media (max-width:480px){nav .wrap{flex-direction:column;align-items:flex-start;gap:8px}.links{justify-content:flex-start}}

main{padding-block:48px 24px;display:grid;gap:64px}
.view{display:grid;gap:56px}

/* Work hero */
.hero{display:grid;gap:20px;max-width:760px}
.status{display:inline-flex;align-items:center;gap:8px;background:var(--mint);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;width:fit-content}
.status i{width:8px;height:8px;border-radius:50%;background:#1E9E5A}
.hero h1{font-size:clamp(40px,6.6vw,72px)}
.lede{font-size:clamp(17px,2vw,20px);color:var(--muted);margin:0;max-width:58ch}
.lede b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:14px;color:var(--muted);margin:0}

/* Highlights */
.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.hl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hl div{border-radius:18px;padding:18px;display:grid;gap:4px;align-content:start;min-width:0}
.hl .n{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4vw,42px);line-height:1}
.hl .l{font-size:14px;color:var(--muted)}

/* Gallery */
.sh{display:grid;gap:8px}
.sh h2{font-size:clamp(30px,4.2vw,44px)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gallery{grid-template-columns:1fr}}
.card{display:grid;gap:12px;text-decoration:none;border-radius:22px;padding:12px 12px 18px;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(27,27,31,.35)}
.cover{border-radius:14px;aspect-ratio:16/10;max-width:100%;overflow:hidden;display:grid;place-items:center}
.cover svg{width:100%;height:100%;display:block;transition:transform .3s ease}
.card:hover .cover svg{transform:scale(1.05) rotate(-1deg)}
.card .meta{padding-inline:6px;display:grid;gap:6px}
.card h3{font-size:22px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600;padding-top:6px}
.card .stat .go{color:var(--accent)}

/* Case study */
.back{text-decoration:none;font-weight:500;font-size:15px;width:fit-content;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.back:hover{background:var(--sky)}
.case-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:820px){.case-head{grid-template-columns:1fr}}
.case-head h1{font-size:clamp(34px,5.4vw,58px)}
.case-head .cover{border-radius:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (max-width:620px){.facts{grid-template-columns:1fr}}
.facts div{background:var(--bg);padding:16px 18px;display:grid;gap:2px}
.facts b{font-weight:600}
.prose{display:grid;gap:40px;max-width:720px}
.prose section{display:grid;gap:12px}
.prose h2{font-size:28px}
.prose p{margin:0}
.prose ul{margin:0;padding-left:20px;display:grid;gap:8px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.results div{border-radius:16px;padding:18px;display:grid;gap:4px}
.results .n{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.results .l{font-size:14px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
.pager a{text-decoration:none;display:grid;gap:2px;padding:10px 14px;border-radius:14px;transition:background .15s ease}
.pager a:hover{background:var(--sky)}
.pager a:last-child{text-align:right;margin-left:auto}
.pager b{font-family:var(--f-display);font-size:19px}

/* About */
.about-head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:820px){.about-head{grid-template-columns:1fr}}
.about-head h1{font-size:clamp(40px,6vw,64px)}
.sticker{aspect-ratio:1;max-width:340px;width:100%;justify-self:center;transition:transform .25s ease}
.sticker:hover{transform:rotate(-4deg) scale(1.02)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 24px 26px;display:grid;gap:2px}
.timeline li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.timeline .yr{font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.timeline b{font-weight:600}
.timeline span.d{color:var(--muted);font-size:15px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{border-radius:22px;padding:24px;display:grid;gap:12px;align-content:start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.kit{display:grid;gap:14px}
.kit .label{display:block;margin-bottom:6px}

/* Footer contact */
footer{border-top:1px solid var(--line);padding-block:48px 40px;display:grid;gap:18px}
footer h2{font-size:clamp(30px,4.6vw,48px)}
.email{font-weight:500;user-select:all;padding:9px 16px;border-radius:999px;background:var(--sky);overflow-wrap:anywhere}
.fine{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);padding-top:12px}

.t-sky{background:var(--sky)} .t-pink{background:var(--pink)} .t-sun{background:var(--sun)} .t-mint{background:var(--mint)} .t-lilac{background:var(--lilac)} .t-peach{background:var(--peach)}
.nowgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.nowgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.nowgrid,.nowgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.nowgrid,.nowgrid.four{grid-template-columns:1fr}}
.panel{transition:transform .2s ease}
.nowgrid .panel:hover{transform:translateY(-3px) rotate(-.5deg)}
.two .panel:hover{transform:translateY(-3px)}
.evlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evlist li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 14px}
.evlist span{color:var(--muted);font-size:15px}
/* Intro */
.intro{display:grid;justify-items:center;text-align:center;gap:22px;padding-block:24px 8px}
.intro h1{font-size:clamp(44px,8vw,96px);line-height:.98;max-width:12ch}
.intro .hi{font-size:1.06em}
.intro .lede{max-width:52ch}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.eyebrow.plain{margin-top:8px}
.chips.center,.row.center{justify-content:center}
.intro .chip{padding:8px 16px;font-size:15px}
.tv{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:16px;width:min(100%,560px);background:var(--sky);border:3px solid var(--ink);border-radius:28px;padding:18px;margin-top:12px;box-shadow:0 22px 40px -28px rgba(27,27,31,.45)}
.screen{position:relative;aspect-ratio:4/3;max-width:100%;border:3px solid var(--ink);border-radius:18px;background:var(--ink);color:#F4F5F7;overflow:hidden;cursor:pointer;display:grid;place-items:center;padding:24px;font:inherit}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px)}
.tvch{position:absolute;top:14px;left:16px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9EA6FF}
.tvbody{display:grid;justify-items:center;gap:14px}
.play{width:64px;height:64px;border-radius:50%;background:#fff;position:relative;transition:transform .2s ease}
.play::after{content:"";position:absolute;left:25px;top:20px;border-left:20px solid var(--ink);border-top:12px solid transparent;border-bottom:12px solid transparent}
.screen:hover .play{transform:scale(1.08)}
.tvtitle{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.tvtext{font-family:var(--f-accent);font-size:clamp(22px,3.6vw,30px);line-height:1.2;text-wrap:balance}
.screen.zap .tvbody{animation:zap .25s ease-out}
@keyframes zap{0%{opacity:0;transform:scaleY(.04)}60%{opacity:1;transform:scaleY(1.02)}100%{transform:none}}
.side{display:grid;justify-items:center;align-content:start;gap:14px;padding-top:4px}
.brand{font-size:12px;font-weight:600;letter-spacing:.12em}
.grille{width:56px;height:84px;border-radius:8px;background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.55}
.knob{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;cursor:pointer;position:relative;transition:transform .25s ease}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
button.knob:hover{transform:rotate(40deg)}
.knob.sm{width:28px;height:28px;cursor:default}
.knob.sm::after{display:none}
.caption{font-family:var(--f-accent);font-style:italic;font-size:22px;color:var(--muted)}
@media (max-width:480px){.tv{grid-template-columns:1fr;}.side{grid-auto-flow:column;align-items:center;justify-content:space-between}.grille{height:28px;width:90px}}
/* Journey map */
.journey{display:grid;gap:22px}
.jgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:860px){.jgrid{grid-template-columns:1fr}}
.cinema{border-radius:22px;overflow:hidden;background:var(--ink);display:grid;min-width:0;box-shadow:0 22px 40px -28px rgba(27,27,31,.5)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;color:#F4F5F7;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;min-height:44px}
.bar .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bar .t i{font-family:var(--f-accent);font-weight:400;font-size:18px;letter-spacing:0;text-transform:none;color:#A9B7FF}
.bar #reel{color:#9EA3AD;font-variant-numeric:tabular-nums}
.bar.bot{text-transform:none;letter-spacing:0;font-weight:500}
.sub{margin:0;font-family:var(--f-accent);font-size:20px;font-weight:400;color:#fff;min-width:0}
.playbtn{flex:none;border:1.5px solid #F4F5F7;background:none;color:#F4F5F7;border-radius:999px;padding:6px 14px;font:600 13px var(--f-body);cursor:pointer;transition:background .15s ease,color .15s ease}
.playbtn:hover{background:#F4F5F7;color:var(--ink)}
.map{position:relative;min-width:0}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(27,27,31,.18))}
.map svg{width:100%;height:auto;display:block;aspect-ratio:800/420}
.lm{position:absolute;inset:0;z-index:2;opacity:0;transform:scale(.04);pointer-events:none;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .45s ease}
.lm.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.lm svg{width:100%;height:100%}
.land{fill:var(--bg);stroke:var(--ink);stroke-width:calc(1px*var(--k,1));stroke-opacity:.35;stroke-linejoin:round}
.mlab{font:italic 400 calc(20px*var(--k,1)) var(--f-accent);fill:var(--muted);opacity:.7}
.seg{fill:none;stroke:var(--ink);stroke-width:calc(2px*var(--k,1));stroke-dasharray:calc(3px*var(--k,1)) calc(7px*var(--k,1));stroke-linecap:round;opacity:.35}
.seg.done{stroke:var(--accent);opacity:1;stroke-width:calc(3px*var(--k,1));stroke-dasharray:none}
.trail{fill:none;stroke:var(--accent);stroke-width:calc(3px*var(--k,1));stroke-linecap:round;stroke-linejoin:round}
.plane path{fill:var(--accent);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.pin{cursor:pointer;outline:none}
.pin .halo{fill:var(--accent);opacity:0;r:calc(16px*var(--k,1));transition:opacity .2s ease}
.pin .dot{fill:var(--bg);stroke:var(--ink);stroke-width:calc(3px*var(--k,1));r:calc(7px*var(--k,1));transition:fill .2s ease}
.pin:hover .dot,.pin:focus-visible .dot{r:calc(10px*var(--k,1))}
.pin:focus-visible .halo{opacity:.25}
.pin.past .dot{fill:var(--accent);stroke:var(--accent)}
.pin.on .dot{fill:var(--accent);stroke:var(--ink);r:calc(10px*var(--k,1))}
.pin.on .halo{opacity:.2}
.plab{font:600 calc(16px*var(--k,1)) var(--f-display);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:calc(5px*var(--k,1));stroke-linejoin:round}
.stop{border:1.5px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:10px;align-content:start;min-width:0}
.stop h3{font-family:var(--f-accent);font-weight:400;font-style:italic;font-size:44px;letter-spacing:-.01em;color:var(--accent)}
.stop ul{margin:0;padding-left:20px;display:grid;gap:6px}
.stop .row{margin-top:auto;padding-top:8px}
.stop .btn:disabled{opacity:.35;cursor:default;transform:none;background:var(--bg)}
.stops{display:flex;flex-wrap:wrap;gap:8px}
.stopbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px 6px 6px;font:500 14px var(--f-body);cursor:pointer;transition:background .15s ease}
.stopbtn span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sky);font-size:12px;font-weight:600}
.stopbtn:hover{background:var(--sky)}
.stopbtn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stopbtn[aria-selected="true"] span{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="logo" href="#work">Ari Huang<span>.</span></a>
  <div class="links">
    <a class="navlink" href="#work" data-nav="work">Work</a>
    <a class="navlink" href="#projects" data-nav="projects">Projects</a>
    <a class="navlink" href="#now" data-nav="now">Now</a>
    <a class="navlink" href="#interests" data-nav="interests">Interests</a>
    <a class="navlink" href="#connect" data-nav="connect">Connect</a>
    <button class="btn resume-btn" type="button">Résumé</button>
  </div>
</div></nav>

<main class="wrap" id="app"></main>

<footer class="wrap" id="connect">
  <span class="label">Connect</span>
  <h2>Got a growth problem in <span class="hi">media</span>? I’d love to hear it.</h2>
  <div class="row">
    <span class="email" id="email">ariana.j.huang@gmail.com</span>
    <button class="btn solid" id="copy" type="button">Copy email</button>
    <a class="btn" href="https://www.linkedin.com/in/arianahuang/" target="_blank" rel="noopener">LinkedIn ↗</a>
    <button class="btn resume-btn" type="button">Résumé ↓</button>
  </div>
  <p class="note" id="dlnote" hidden></p>
  <div class="fine"><span>© 2026 Ariana Huang</span><span>Made in New York</span></div>
</footer>

<script>
/* ---------- Illustrations (simple shapes, one per project) ---------- */
const ART = {
  reinvent:`<svg viewBox="0 0 320 200" aria-hidden="true"><rect width="320" height="200" fill="#DCE6FF"/>
    <g transform="rotate(-8 160 100)"><rect x="70" y="58" width="180" height="84" rx="12" fill="#fff" stroke="#1B1B1F" stroke-width="3"/>
    <line x1="196" y1="62" x2="196" y2="138" stroke="#1B1B1F" stroke-width="3" stroke-dasharray="6 6"/>
    <rect x="86" y="76" width="92" height="12" rx="6" fill="#3A5BFF"/><rect x="86" y="98" width="70" height="8" rx="4" fill="#1B1B1F" opacity=".2"/><rect x="86" y="114" width="56" height="8" rx="4" fill="#1B1B1F" opacity=".2"/>
    <circle cx="223" cy="100" r="14" fill="#FFF0BF" stroke="#1B1B1F" stroke-width="3"/><path d="M216 100l5 5 9-10" fill="none" stroke="#1B1B1F" stroke-width="3" stroke-linecap="round"/></g></svg>`,
  channels:`<svg viewBox="0 0 320 200" aria-hidden="true"><rect width="320" height="200" fill="#FFE1EC"/>
    <g fill="#fff" stroke="#1B1B1F" stroke-width="3"><rect x="58" y="70" width="120" height="78" rx="10" transform="rotate(-10 118 109)"/><rect x="102" y="58" width="120" height="78" rx="10"/><rect x="146" y="74" width="120" height="78" rx="10" transform="rotate(8 206 113)"/></g>

/* ---------- TV ---------- */
const TV=[
  ["CH 1 · The day job","5 years at AWS. Started in sales, then executive, event, lifecycle and channel marketing."],
  ["CH 2 · The receipts","$10B+ pipeline. +10% re:Invent conversion. $615K ARR in one quarter."],
  ["CH 3 · Right now","Tech MBA at Cornell Tech, growth intern at Boostability, building SleepPillow in Product Studio."],
  ["CH 4 · Off air","Volleyball around NYC, hunting for cafes, traveling, and a lot of TV."],
  ["CH 5 · Coming up next","Product marketing, product, BD and partnerships in ad-tech, media, streaming and sports tech."]
];
let tvi=-1;
function bindTV(){
  const scr=document.getElementById("tvscreen"); if(!scr) return; tvi=-1;
  const next=()=>{tvi=(tvi+1)%TV.length;const [ch,t]=TV[tvi];
    document.getElementById("tvch").textContent=ch;
    document.getElementById("tvbody").innerHTML=`<span class="tvtext">${t}</span>`;
    scr.classList.remove("zap");void scr.offsetWidth;scr.classList.add("zap")};
  scr.addEventListener("click",next); document.getElementById("tvknob").addEventListener("click",next);
}

/* ---------- Router ---------- */
const app=document.getElementById("app");
const VIEWS={work:workView,projects:projectsView,now:nowView,interests:interestsView};
function route(){
  const h=(location.hash||"#work").slice(1);
  let page;
  if(h==="connect"){ if(!app.innerHTML) {app.innerHTML=workView();bindTV()} setNav("connect"); bindResume(); document.getElementById("connect").scrollIntoView(); return }
  if(VIEWS[h]){app.innerHTML=VIEWS[h]();page=h}
  else if(h.startsWith("case-")&&CASES.some(c=>"case-"+c.id===h)){const c=CASES.find(x=>"case-"+x.id===h);app.innerHTML=caseView(c.id);page=c.kind==="work"?"work":"projects"}
  else {app.innerHTML=workView();page="work"}
  setNav(page); window.scrollTo(0,0); bindResume(); bindTV(); bindPath();
}
function setNav(page){document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",false));const cur=document.querySelector(`[data-nav="${page}"]`);if(cur)cur.setAttribute("aria-current","page")}

/* ---------- Résumé download ---------- */
let dl=null;(async()=>{try{dl=await window.claude?.use?.("downloads")}catch(_){dl=null}})();
const note=document.getElementById("dlnote");
function bindResume(){
  document.querySelectorAll(".resume-btn:not([data-bound])").forEach(b=>{b.dataset.bound="1";b.addEventListener("click",async()=>{
    const msg=t=>{note.textContent=t;note.hidden=false;note.scrollIntoView({block:"nearest"})};
    if(!dl){const a=document.createElement("a");a.href="resume.pdf";a.download="Ariana_Huang_Resume.pdf";document.body.appendChild(a);a.click();a.remove();return}
    try{const blob=await (await fetch("resume.pdf")).blob();await dl.save({filename:"Ariana_Huang_Resume.pdf",data:blob})}
    catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){msg("One sec, then try again.");return}msg("The résumé download isn’t available right now. Grab it from LinkedIn or email me.")}
  })});
}
document.getElementById("copy").addEventListener("click",e=>{
  const b=e.currentTarget,t=document.getElementById("email").textContent;
  const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("email"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected, now copy"};
  try{navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied!"},sel)}catch(_){sel()}
  setTimeout(()=>b.textContent="Copy email",2200);
});
window.addEventListener("hashchange",route);
route();
</script>
